model = "gpt-5.6-sol"
model_reasoning_effort = "high"
default_permissions = ":danger-full-access"
approval_policy = "never"
personality = "pragmatic"

[agents]
max_threads = 12

[agents.review_critical]
description = "Run a dynamically scoped correctness, compliance, or high-risk review."
config_file = "agents/review-critical.toml"

[agents.review_general]
description = "Run a dynamically scoped verification, simplicity, or domain review."
config_file = "agents/review-general.toml"

[tui]
terminal_title = ["thread-id"]
status_line = ["model-with-reasoning", "current-dir", "weekly-limit", "context-remaining"]
status_line_use_colors = true
resume_cwd = "session"

[features]
hooks = true

[marketplaces.personal]
source_type = "git"
source = "https://github.com/raulfrk/setforge-config.git"

[plugins."revdiff-herdr@personal"]
enabled = true

[hooks.state]

[hooks.state."revdiff-herdr@personal:hooks/hooks.json:stop:0:0"]
trusted_hash = "sha256:15dd2fab1de96a58d9e688e4131b990aeb70b98411c3351687478838114b9b06"
