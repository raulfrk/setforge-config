model = "gpt-6.1-sol"
tool_output_token_limit = 5000
check_for_update_on_startup = false
hide_agent_reasoning = false
show_raw_agent_reasoning = true
model_reasoning_summary = "detailed"
model_reasoning_effort = "high"
plan_mode_reasoning_effort = "xhigh"
service_tier = "default"
default_permissions = ":danger-full-access"
approval_policy = "never"
approvals_reviewer = "user"
personality = "pragmatic"

[agents]
max_threads = 12
default_subagent_model = "gpt-6.1-sol"
default_subagent_reasoning_effort = "medium"

[features.multi_agent_v2]
default_wait_timeout_ms = 600000
max_wait_timeout_ms = 3600000

[features.context_management]
experimental_mode = true

[agents.review_correctness]
description = "Run an independent requirements and correctness review."
config_file = "agents/review-correctness.toml"

[agents.review_critical]
description = "Run a dynamically scoped correctness, compliance, or high-risk review."
config_file = "agents/review-critical.toml"

[agents.review_general]
description = "Run a dynamically scoped verification, simplicity, or domain review."
config_file = "agents/review-general.toml"

[tui]
# Plugin Kit uses this thread ID to verify abbreviated /status identities.
terminal_title = ["thread-id"]
status_line = ["model-with-reasoning", "current-dir", "weekly-limit", "context-remaining"]
status_line_use_colors = true
resume_cwd = "session"

[tui.keymap.global]
toggle_side_conversation = ["ctrl-/", "ctrl-]"]

[features]
hooks = true
memories = true
daemon_auto_start = false

[marketplaces.personal]
source_type = "git"
source = "https://github.com/raulfrk/setforge-config.git"

[plugins."revdiff-herdr@personal"]
enabled = true

# Disable Pages capabilities locally; keep the remote plugin and existing data.
[apps.connector_openai_pages]
enabled = false

[[skills.config]]
name = "pages:maintain-space"
enabled = false

[[skills.config]]
name = "pages:manage-schedules"
enabled = false

[[skills.config]]
name = "pages:organize-space"
enabled = false

[[skills.config]]
name = "pages:write-page"
enabled = false

[notice]
hide_rate_limit_model_nudge = true
